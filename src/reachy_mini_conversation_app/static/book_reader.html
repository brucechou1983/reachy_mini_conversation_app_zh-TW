<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>故事書 - Reachy Mini</title>
    <link rel="stylesheet" href="/static/reader.css" />
  </head>
  <body>
    <div id="reader-screen" class="screen active">
      <div class="page-container">
        <div class="illustration">
          <img id="page-image" src="" alt="故事插畫" />
        </div>
        <div class="text-area">
          <p id="page-text"></p>
        </div>
        <div class="page-nav">
          <button id="prev-btn" class="nav-btn" disabled>&#8592; 上一頁</button>
          <div class="page-indicator">
            <span id="page-num">1</span> / <span id="page-total">1</span>
          </div>
          <button id="next-btn" class="nav-btn" disabled>下一頁 &#8594;</button>
        </div>
      </div>
      <div class="book-actions">
        <a href="/reader" class="action-link">&#8592; 回書架</a>
        <a id="download-link" class="action-btn" download>下載此書</a>
        <button id="delete-btn" class="action-btn danger">刪除此書</button>
      </div>
    </div>

    <div id="error-screen" class="screen">
      <div class="book-icon">⚠️</div>
      <h1>找不到故事書</h1>
      <p><a href="/reader" style="color: var(--reader-accent)">回書架</a></p>
    </div>

    <script src="/static/book_reader.js"></script>
  </body>
</html>
