name: uv.lock check

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"

jobs:
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hbelmiro/uv-lock-check@v0.2.0
        with:
          # Only verify the lock is in sync; the default "uv sync" would try to
          # build PyGObject/pycairo (needs system cairo) and fail.
          command: "uv lock --check"
